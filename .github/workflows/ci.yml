name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 코드가 바뀌지 않아도 새로 공개된 취약점을 알 수 있도록 매주 월요일에 한 번 실행한다
  schedule:
    - cron: '0 0 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 운영에 들어가는 의존성만 검사한다 (개발 도구의 취약점은 서비스에 영향이 없다). high 이상이 있으면 실패한다.
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: 이미지 빌드
        run: docker build -t game-calendar .
      - name: 컨테이너 기동 확인
        run: |
          docker run -d --name app -p 4000:4000 game-calendar
          for i in $(seq 20); do
            curl -fs http://localhost:4000/api/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
